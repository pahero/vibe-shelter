name: Build and deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      seed_admin:
        description: Reset admin@shelter.local to SEED_ADMIN_PASSWORD
        required: false
        default: false
        type: boolean

concurrency:
  group: shelter-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runner
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: migration
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/migration:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    name: Deploy production
    needs: build
    runs-on: [self-hosted, Linux, X64]
    environment: production
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Pull and deploy images
        shell: bash
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          STORAGE_DOMAIN: ${{ vars.STORAGE_DOMAIN }}
          HTTP_PORT: ${{ vars.HTTP_PORT }}
          HTTPS_PORT: ${{ vars.HTTPS_PORT }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SESSION_TTL_HOURS: ${{ vars.SESSION_TTL_HOURS }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          GARAGE_RPC_SECRET: ${{ secrets.GARAGE_RPC_SECRET }}
          GARAGE_ACCESS_KEY: ${{ secrets.GARAGE_ACCESS_KEY }}
          GARAGE_SECRET_KEY: ${{ secrets.GARAGE_SECRET_KEY }}
          GARAGE_BUCKET: ${{ vars.GARAGE_BUCKET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ vars.GOOGLE_CALLBACK_URL }}
          ALLOWED_GOOGLE_DOMAIN: ${{ vars.ALLOWED_GOOGLE_DOMAIN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEED_ADMIN: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_admin || false }}
        run: |
          set -euo pipefail
          umask 077

          deploy_env_file="${RUNNER_TEMP}/shelter-production-${GITHUB_RUN_ID}.env"
          trap 'rm -f -- "${deploy_env_file}"' EXIT

          HTTP_PORT="${HTTP_PORT:-80}"
          HTTPS_PORT="${HTTPS_PORT:-443}"
          POSTGRES_USER="${POSTGRES_USER:-shelter}"
          POSTGRES_DB="${POSTGRES_DB:-shelter}"
          SESSION_TTL_HOURS="${SESSION_TTL_HOURS:-168}"
          GARAGE_BUCKET="${GARAGE_BUCKET:-shelter}"
          GOOGLE_CALLBACK_URL="${GOOGLE_CALLBACK_URL:-https://${APP_DOMAIN}/auth/google/callback}"
          ALLOWED_GOOGLE_DOMAIN="${ALLOWED_GOOGLE_DOMAIN:-}"
          FRONTEND_IMAGE="${IMAGE_PREFIX}/frontend:${GITHUB_SHA}"
          BACKEND_IMAGE="${IMAGE_PREFIX}/backend:${GITHUB_SHA}"
          MIGRATION_IMAGE="${IMAGE_PREFIX}/migration:${GITHUB_SHA}"

          required=(
            APP_DOMAIN STORAGE_DOMAIN POSTGRES_PASSWORD SESSION_SECRET
            SEED_ADMIN_PASSWORD GARAGE_RPC_SECRET GARAGE_ACCESS_KEY
            GARAGE_SECRET_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub production variable or secret: ${name}" >&2
              exit 1
            fi
          done

          names=(
            APP_DOMAIN STORAGE_DOMAIN HTTP_PORT HTTPS_PORT POSTGRES_USER
            POSTGRES_PASSWORD POSTGRES_DB SESSION_SECRET SESSION_TTL_HOURS
            SEED_ADMIN_PASSWORD GARAGE_RPC_SECRET GARAGE_ACCESS_KEY
            GARAGE_SECRET_KEY GARAGE_BUCKET GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET GOOGLE_CALLBACK_URL ALLOWED_GOOGLE_DOMAIN
            FRONTEND_IMAGE BACKEND_IMAGE MIGRATION_IMAGE
          )
          : > "${deploy_env_file}"
          for name in "${names[@]}"; do
            value="${!name:-}"
            if [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "Deployment value ${name} must not contain a newline" >&2
              exit 1
            fi
            printf '%s=%s\n' "${name}" "${value}" >> "${deploy_env_file}"
          done

          printf '%s' "${GHCR_TOKEN}" | podman login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

          compose=(podman-compose --env-file "${deploy_env_file}" -f compose.prod.yml)
          "${compose[@]}" config --quiet
          "${compose[@]}" pull
          "${compose[@]}" up -d --remove-orphans

          if [[ "${SEED_ADMIN}" == 'true' ]]; then
            "${compose[@]}" --profile bootstrap run --rm seed
          fi

          health_services=(postgres garage backend frontend)
          healthy=false
          for _ in {1..60}; do
            healthy=true
            for service in "${health_services[@]}"; do
              container_id="$("${compose[@]}" ps -q "${service}")"
              if [[ -z "${container_id}" ]]; then
                healthy=false
                continue
              fi
              status="$(podman inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${container_id}")"
              if [[ "${status}" != 'healthy' ]]; then healthy=false; fi
            done
            if [[ "${healthy}" == 'true' ]]; then break; fi
            sleep 5
          done

          if [[ "${healthy}" != 'true' ]]; then
            "${compose[@]}" ps -a
            "${compose[@]}" logs --no-color --tail 200
            exit 1
          fi

          migration_id="$("${compose[@]}" ps -a -q migrate)"
          migration_exit_code="$(podman inspect --format '{{.State.ExitCode}}' "${migration_id}")"
          if [[ "${migration_exit_code}" != '0' ]]; then
            echo "Migration failed with exit code ${migration_exit_code}" >&2
            exit 1
          fi

          health_response="$(curl --fail --silent --show-error --max-time 30 "https://${APP_DOMAIN}/health")"
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' <<< "${health_response}"
          "${compose[@]}" ps -a
