name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      seed_admin:
        description: Reset admin@shelter.local to SEED_ADMIN_PASSWORD
        required: false
        default: false
        type: boolean

concurrency:
  group: shelter-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: [self-hosted, Linux, X64]
    environment: production
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Initialize deployment paths
        run: |
          set -euo pipefail
          printf 'DEPLOY_ENV_FILE=%s/shelter-production-%s.env\n' "${RUNNER_TEMP}" "${GITHUB_RUN_ID}" >> "${GITHUB_ENV}"
          containers_conf_override="${RUNNER_TEMP}/shelter-containers-${GITHUB_RUN_ID}.conf"
          printf '[engine]\ncgroup_manager="cgroupfs"\n' > "${containers_conf_override}"
          chmod 600 "${containers_conf_override}"
          printf 'CONTAINERS_CONF_OVERRIDE=%s\n' "${containers_conf_override}" >> "${GITHUB_ENV}"

      - name: Verify Podman runner configuration
        run: |
          set -euo pipefail
          podman info --format 'rootless={{.Host.Security.Rootless}} cgroupManager={{.Host.CgroupManager}} runtime={{.Host.OCIRuntime.Name}}'

      - name: Create deployment environment
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          STORAGE_DOMAIN: ${{ vars.STORAGE_DOMAIN }}
          HTTP_PORT: ${{ vars.HTTP_PORT }}
          HTTPS_PORT: ${{ vars.HTTPS_PORT }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SESSION_TTL_HOURS: ${{ vars.SESSION_TTL_HOURS }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          GARAGE_RPC_SECRET: ${{ secrets.GARAGE_RPC_SECRET }}
          GARAGE_ACCESS_KEY: ${{ secrets.GARAGE_ACCESS_KEY }}
          GARAGE_SECRET_KEY: ${{ secrets.GARAGE_SECRET_KEY }}
          GARAGE_BUCKET: ${{ vars.GARAGE_BUCKET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ vars.GOOGLE_CALLBACK_URL }}
          ALLOWED_GOOGLE_DOMAIN: ${{ vars.ALLOWED_GOOGLE_DOMAIN }}
        run: |
          set -euo pipefail
          umask 077

          HTTP_PORT="${HTTP_PORT:-80}"
          HTTPS_PORT="${HTTPS_PORT:-443}"
          POSTGRES_USER="${POSTGRES_USER:-shelter}"
          POSTGRES_DB="${POSTGRES_DB:-shelter}"
          SESSION_TTL_HOURS="${SESSION_TTL_HOURS:-168}"
          GARAGE_BUCKET="${GARAGE_BUCKET:-shelter}"
          GOOGLE_CALLBACK_URL="${GOOGLE_CALLBACK_URL:-https://${APP_DOMAIN}/auth/google/callback}"
          ALLOWED_GOOGLE_DOMAIN="${ALLOWED_GOOGLE_DOMAIN:-}"

          required=(
            APP_DOMAIN
            STORAGE_DOMAIN
            POSTGRES_PASSWORD
            SESSION_SECRET
            SEED_ADMIN_PASSWORD
            GARAGE_RPC_SECRET
            GARAGE_ACCESS_KEY
            GARAGE_SECRET_KEY
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub production variable or secret: ${name}" >&2
              exit 1
            fi
          done

          names=(
            APP_DOMAIN
            STORAGE_DOMAIN
            HTTP_PORT
            HTTPS_PORT
            POSTGRES_USER
            POSTGRES_PASSWORD
            POSTGRES_DB
            SESSION_SECRET
            SESSION_TTL_HOURS
            SEED_ADMIN_PASSWORD
            GARAGE_RPC_SECRET
            GARAGE_ACCESS_KEY
            GARAGE_SECRET_KEY
            GARAGE_BUCKET
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            GOOGLE_CALLBACK_URL
            ALLOWED_GOOGLE_DOMAIN
          )

          : > "${DEPLOY_ENV_FILE}"
          for name in "${names[@]}"; do
            value="${!name:-}"
            if [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "Deployment value ${name} must not contain a newline" >&2
              exit 1
            fi
            printf '%s=%s\n' "${name}" "${value}" >> "${DEPLOY_ENV_FILE}"
          done

      - name: Validate Compose configuration
        run: |
          set -euo pipefail
          podman-compose --env-file "${DEPLOY_ENV_FILE}" -f compose.prod.yml config --quiet

      - name: Build deployment images
        run: |
          set -euo pipefail
          podman-compose --env-file "${DEPLOY_ENV_FILE}" -f compose.prod.yml build

      - name: Deploy stack
        run: |
          set -euo pipefail
          podman-compose --env-file "${DEPLOY_ENV_FILE}" -f compose.prod.yml up -d --remove-orphans

      - name: Bootstrap or reset admin
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_admin == true }}
        run: |
          set -euo pipefail
          podman-compose --env-file "${DEPLOY_ENV_FILE}" -f compose.prod.yml --profile bootstrap run --rm seed

      - name: Verify services
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          set -euo pipefail
          compose=(podman-compose --env-file "${DEPLOY_ENV_FILE}" -f compose.prod.yml)
          health_services=(postgres garage backend frontend)
          healthy=false

          for _ in {1..60}; do
            healthy=true
            for service in "${health_services[@]}"; do
              container_id="$("${compose[@]}" ps -q "${service}")"
              if [[ -z "${container_id}" ]]; then
                healthy=false
                continue
              fi

              status="$(podman inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${container_id}")"
              if [[ "${status}" != 'healthy' ]]; then
                healthy=false
              fi
            done

            if [[ "${healthy}" == 'true' ]]; then break; fi
            sleep 5
          done

          if [[ "${healthy}" != 'true' ]]; then
            echo 'Services did not become healthy within five minutes' >&2
            exit 1
          fi

          migration_id="$("${compose[@]}" ps -a -q migrate)"
          if [[ -z "${migration_id}" ]]; then
            echo 'Migration container was not created' >&2
            exit 1
          fi
          migration_exit_code="$(podman inspect --format '{{.State.ExitCode}}' "${migration_id}")"
          if [[ "${migration_exit_code}" != '0' ]]; then
            echo "Migration failed with exit code ${migration_exit_code}" >&2
            exit 1
          fi

          health_response="$(curl --fail --silent --show-error --max-time 30 "https://${APP_DOMAIN}/health")"
          if ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' <<< "${health_response}"; then
            echo 'Public backend health check failed' >&2
            exit 1
          fi

      - name: Show deployment status
        run: |
          set -euo pipefail
          podman-compose --env-file "${DEPLOY_ENV_FILE}" -f compose.prod.yml ps -a

      - name: Show failure diagnostics
        if: ${{ failure() }}
        run: |
          if [[ -f "${DEPLOY_ENV_FILE}" ]]; then
            podman-compose --env-file "${DEPLOY_ENV_FILE}" -f compose.prod.yml ps -a || true
            podman-compose --env-file "${DEPLOY_ENV_FILE}" -f compose.prod.yml logs --no-color --tail 200 || true
          fi

      - name: Remove temporary deployment environment
        if: ${{ always() }}
        run: |
          deploy_env_file="${DEPLOY_ENV_FILE:-${RUNNER_TEMP}/shelter-production-${GITHUB_RUN_ID}.env}"
          containers_conf_override="${CONTAINERS_CONF_OVERRIDE:-${RUNNER_TEMP}/shelter-containers-${GITHUB_RUN_ID}.conf}"
          rm -f -- "${deploy_env_file}"
          rm -f -- "${containers_conf_override}"
