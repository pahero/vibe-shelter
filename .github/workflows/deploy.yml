name: Build and deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      seed_admin:
        description: Reset admin@shelter.local to SEED_ADMIN_PASSWORD
        required: false
        default: false
        type: boolean

concurrency:
  group: shelter-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runner
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  migrate:
    name: Run database migrations
    needs: build
    runs-on: [self-hosted, Linux, X64]
    environment: production
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Start PostgreSQL and migrate
        shell: bash
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          SEED_ADMIN: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_admin || false }}
          SEED_ADMIN_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_admin && secrets.SEED_ADMIN_PASSWORD || '' }}
        run: |
          set -euo pipefail
          POSTGRES_USER="${POSTGRES_USER:-shelter}"
          POSTGRES_DB="${POSTGRES_DB:-shelter}"
          POSTGRES_PORT="${POSTGRES_PORT:-5432}"
          : "${POSTGRES_PASSWORD:?Missing GitHub production secret: POSTGRES_PASSWORD}"
          export POSTGRES_USER POSTGRES_DB POSTGRES_PORT POSTGRES_PASSWORD
          docker compose -f compose.postgres.yml up -d --wait postgres
          export DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT}/${POSTGRES_DB}"
          (cd "${GITHUB_WORKSPACE}/backend" && sh ./scripts/migrate.sh)

  deploy:
    name: Deploy production
    needs: migrate
    runs-on: [self-hosted, Linux, X64]
    environment: production
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Pull and deploy built images
        shell: bash
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          STORAGE_DOMAIN: ${{ vars.STORAGE_DOMAIN }}
          HTTP_PORT: ${{ vars.HTTP_PORT }}
          HTTPS_PORT: ${{ vars.HTTPS_PORT }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SESSION_TTL_HOURS: ${{ vars.SESSION_TTL_HOURS }}
          GARAGE_RPC_SECRET: ${{ secrets.GARAGE_RPC_SECRET }}
          GARAGE_ACCESS_KEY: ${{ secrets.GARAGE_ACCESS_KEY }}
          GARAGE_SECRET_KEY: ${{ secrets.GARAGE_SECRET_KEY }}
          GARAGE_BUCKET: ${{ vars.GARAGE_BUCKET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ vars.GOOGLE_CALLBACK_URL }}
          ALLOWED_GOOGLE_DOMAIN: ${{ vars.ALLOWED_GOOGLE_DOMAIN }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
          WEB_PUSH_PUBLIC_KEY: ${{ vars.WEB_PUSH_PUBLIC_KEY }}
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
          WEB_PUSH_SUBJECT: ${{ vars.WEB_PUSH_SUBJECT }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          deploy_env_file="${RUNNER_TEMP}/shelter-production-${GITHUB_RUN_ID}.env"
          cleanup() { rm -f -- "${deploy_env_file}"; docker logout ghcr.io > /dev/null 2>&1 || true; }
          trap cleanup EXIT
          HTTP_PORT="${HTTP_PORT:-80}"; HTTPS_PORT="${HTTPS_PORT:-443}"
          POSTGRES_USER="${POSTGRES_USER:-shelter}"; POSTGRES_DB="${POSTGRES_DB:-shelter}"
          SESSION_TTL_HOURS="${SESSION_TTL_HOURS:-168}"; GARAGE_BUCKET="${GARAGE_BUCKET:-shelter}"
          GOOGLE_CALLBACK_URL="${GOOGLE_CALLBACK_URL:-https://${APP_DOMAIN}/auth/google/callback}"
          ALLOWED_GOOGLE_DOMAIN="${ALLOWED_GOOGLE_DOMAIN:-}"
          FRONTEND_IMAGE="${IMAGE_PREFIX}/frontend:${GITHUB_SHA}"
          BACKEND_IMAGE="${IMAGE_PREFIX}/backend:${GITHUB_SHA}"
          required=(APP_DOMAIN STORAGE_DOMAIN POSTGRES_PASSWORD SESSION_SECRET GARAGE_RPC_SECRET GARAGE_ACCESS_KEY GARAGE_SECRET_KEY JWT_SECRET WEB_PUSH_PUBLIC_KEY WEB_PUSH_PRIVATE_KEY WEB_PUSH_SUBJECT NEXT_PUBLIC_RECAPTCHA_SITE_KEY RECAPTCHA_SECRET_KEY SMTP_USER SMTP_PASSWORD SMTP_FROM)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub production variable or secret: ${name}" >&2
              exit 1
            fi
          done
          POSTGRES_PORT="${POSTGRES_PORT:-5432}"
          names=(APP_DOMAIN STORAGE_DOMAIN HTTP_PORT HTTPS_PORT POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB POSTGRES_PORT SESSION_SECRET SESSION_TTL_HOURS GARAGE_RPC_SECRET GARAGE_ACCESS_KEY GARAGE_SECRET_KEY GARAGE_BUCKET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_CALLBACK_URL ALLOWED_GOOGLE_DOMAIN SMTP_USER SMTP_PASSWORD SMTP_FROM SMTP_HOST SMTP_PORT SMTP_SECURE FRONTEND_IMAGE BACKEND_IMAGE JWT_SECRET WEB_PUSH_PUBLIC_KEY WEB_PUSH_PRIVATE_KEY WEB_PUSH_SUBJECT NEXT_PUBLIC_RECAPTCHA_SITE_KEY RECAPTCHA_SECRET_KEY)
          : > "${deploy_env_file}"
          for name in "${names[@]}"; do
            value="${!name:-}"
            if [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "Deployment value ${name} must not contain a newline" >&2
              exit 1
            fi
            printf '%s=%s\n' "${name}" "${value}" >> "${deploy_env_file}"
          done
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          if ! docker compose --env-file "${deploy_env_file}" -f compose.prod.yml up \
            -d --no-build --remove-orphans --wait --wait-timeout 300; then
            docker compose --env-file "${deploy_env_file}" -f compose.prod.yml ps -a
            docker compose --env-file "${deploy_env_file}" -f compose.prod.yml logs --no-color --tail 200
            exit 1
          fi
