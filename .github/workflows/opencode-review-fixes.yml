name: OpenCode Review Fixes

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  fix-review:
    if: >-
      github.event.review.state == 'changes_requested' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association) ||
      github.event.review.user.login == 'opencode-agent[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the reviewed pull request
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Fix requested review changes with OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/openai/gpt-6-luna
          prompt: |
            Review feedback requested changes on pull request ${{ github.event.pull_request.html_url }}.
            Read the complete review body and its inline review comments, then implement the requested
            changes on the checked-out pull request branch. Follow repository instructions and add
            or update tests for behavior changes. Do not address unrelated suggestions or weaken tests.
            Run relevant checks. If all requested changes are addressed and checks pass, commit and
            push the changes to this pull request branch. If anything is unclear, cannot be safely
            fixed, or checks fail, do not push; explain the blocker in a pull request comment.
