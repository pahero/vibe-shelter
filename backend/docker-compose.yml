version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shelter_user
      POSTGRES_PASSWORD: shelter_password
      POSTGRES_DB: postgres
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelter_user"]
      interval: 10s
      timeout: 5s
      retries: 5
