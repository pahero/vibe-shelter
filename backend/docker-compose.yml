version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shelter_user
      POSTGRES_PASSWORD: shelter_password
      POSTGRES_DB: postgres
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelter_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-GKcc07e066098775f0bfd9a3f74a8b00fa}
      GARAGE_DEFAULT_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-ca4915e4ecba9c92d21e2a93d6c61fbaf68af324a6158160bc061c93cfd9e560}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-shelter}
    ports:
      - 3900:3900
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  garage-data:
